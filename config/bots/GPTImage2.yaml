name: GPT-Image-2
innerName: GPT-Image-2

# Model configuration
# Image generation models use 'chat' mode (no prefill for image APIs)
mode: chat
continuation_model: gpt-image-2-c
temperature: 1.0
max_tokens: 4096
top_p: 1.0

# Context configuration - the image model reads conversation directly
recency_window_messages: 400
recency_window_characters: 100000
hard_max_characters: 500000
rolling_threshold: 50
recent_participant_count: 10
authorized_roles: []

# Image configuration
# include_images: true lets the bot see prior images for editing
include_images: true
max_images: 5

# Tool configuration - disabled for pure image generation
tools_enabled: false
tool_output_visible: false
max_tool_depth: 1

# Stop sequences
stop_sequences: []

# Retry configuration
llm_retries: 3
discord_backoff_max: 32000

# Misc
reply_on_random: 0
reply_on_name: true
max_queued_replies: 1

# Soma integration (credit system) - optional
soma:
  enabled: true
  url: "http://localhost:3100/api/v1"
  token: "chapterx-bots-token-2024"
